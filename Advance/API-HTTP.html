<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
    .card {
        
        width: 500px;
        height: 600px;
        box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
        transition: 0.3s;
      }
    .container {
        padding: 2px 16px;
      }
      #b1{
        background-color:aquamarine;
        height: 50px;
        width: 100px;
         border: 2px solid black;
        border-radius: 10%;
       
      }
      
    </style>
</head>
<body style="background-color: #212121;">

<button id="b1">For hitesh sir</button>
<div class="card">
        <img src="img_avatar.png" alt="Avatar" style="width:100%">
        <div class="container">
          <h4>John Doe</h4>
          <p>Architect & Engineer</p>
        </div>
      </div>
</body>
<script>
document.getElementById("b1").addEventListener('click',function(){
    const requestUrl = 'https://api.github.com/users/hiteshchoudhary'
    const xhr = new XMLHttpRequest();
    xhr.open('GET', requestUrl)
    xhr.onreadystatechange = function(){
        console.log(xhr.readyState);
         if (xhr.readyState === 4) {
            const data = JSON.parse(this.responseText)
            // console.log(typeof data);/// here we get object

            document.querySelector(".card img").setAttribute("src" , `${data.avatar_url}`);
            document.querySelector("h4").innerHTML = `${data.name} , Followers : ${data.followers}`;
            document.querySelector("h4").style.fontWeight = `bold`;
            document.querySelector("p").innerHTML = `${data.bio}  ${data.blog}`
            
            
         }
    }
    xhr.send();
    })
</script>
</html>
